services:
  - type: web
    name: ai-civic-copilot-api
    runtime: node
    rootDir: .
    buildCommand: npm install
    startCommand: node backend/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://ai-civic-copilot.vercel.app
